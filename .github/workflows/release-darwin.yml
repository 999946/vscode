name: Release macOS (x64 + arm64)

# Builds the fork's macOS release for both Intel (x64) and Apple Silicon
# (arm64), ad-hoc signed (no Apple developer certificate, same as terax),
# packaged as a DMG and attached to a GitHub Release.
#
# Trigger: push a tag matching `release-*` (e.g. `release-v0.1.0`), or run
# manually from the Actions tab (workflow_dispatch).
#
# Usage notes for the end user:
#   - M-series Macs: Apple Silicon DMG; Intel Macs: Intel DMG.
#   - The app is ad-hoc signed, so Gatekeeper will block first launch.
#     Remove the quarantine first:
#       xattr -cr "/Applications/ParaCode.app"
#   - Or right-click → Open → Open (once).

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version for manual dispatch (e.g. 0.2.0 → tag v0.2.0); defaults to an auto-generated timestamp tag'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build macOS (${{ matrix.arch }})
    # Standard macOS runner (included free minutes on public repos). Note:
    # `macos-26-xlarge` is a GitHub Larger Runner and requires paid billing —
    # personal forks should stick to the standard runner.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      VSCODE_ARCH: ${{ matrix.arch }}
      # x64 cross-builds from the arm64 runner need npm to resolve the
      # host-node architecture; arm64 uses its native arch. This matches the
      # official pr-darwin-test.yml recipe.
      NPM_ARCH: ${{ matrix.arch }}
      # Skip downloading Electron/Chromium during npm ci; setup-electron
      # fetches the exact arch below.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Avoid dlopen of Kerberos on macOS (missing libs); official CI flag.
      GYP_DEFINES: 'kerberos_use_rtld=false'

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Python setuptools (dmgbuild)
        run: python3 -m pip install --break-system-packages setuptools

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-macos
          key-args: 'darwin ${{ env.VSCODE_ARCH }} $(node -p process.arch)'

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GYP_DEFINES: 'kerberos_use_rtld=false'

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Prepare built-in extensions cache key
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: 'builtin-extensions-${{ hashFiles(''.build/builtindepshash'') }}'

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Electron
        uses: ./.github/actions/setup-electron
        with:
          arch: ${{ env.VSCODE_ARCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The copilot extension is excluded from the local-extensions packaging
      # (build/lib/extensions.ts excludedExtensions), so it is NOT picked up by
      # core-ci. Official Azure CI downloads it as a VSIX; on GitHub Actions we
      # compile it from source and drop it into .build/extensions before the
      # darwin packaging task runs.
      - name: Compile copilot extension (source)
        working-directory: extensions/copilot
        run: npm run compile

      - name: Package copilot extension into build
        run: npm run gulp compile-copilot-extension-build

      - name: Compile core
        run: npm run gulp core-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package .app (${{ matrix.arch }})
        run: npm run gulp vscode-darwin-${{ env.VSCODE_ARCH }}-min-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ad-hoc sign app
        run: codesign --force --deep --sign - '../ParaCode-darwin-${{ env.VSCODE_ARCH }}/ParaCode.app'

      - name: Verify code signature
        run: codesign --verify --deep --strict '../ParaCode-darwin-${{ env.VSCODE_ARCH }}/ParaCode.app'

      # Resolve the release tag before packaging so the DMG artifact can be
      # named with the release version. On a tag push GITHUB_REF_NAME is already
      # the bare tag; on manual dispatch we build one from the input, or fall
      # back to a timestamp tag when the input is blank.
      - name: Determine release tag
        id: release-tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create DMG
        id: create-dmg
        run: |
          mkdir -p out
          # Derive the changelog version key from the tag, e.g. release-v1.2.3 -> 1.2.3.
          VER="${{ steps.release-tag.outputs.tag }}"
          VER="${VER#release-v}"
          # create-dmg.ts joins its buildDir arg with `ParaCode-darwin-${VSCODE_ARCH}`
          # (build/darwin/create-dmg.ts:161). The gulp packaging task writes the
          # .app under the repo's PARENT directory (buildRoot = dirname(repo)),
          # so the arg is `..`, not the arch-specific path.
          node build/darwin/create-dmg.ts '..' "$(pwd)/out" "$VER"
          echo "dmg-name=ParaCode-darwin-$VER-${{ env.VSCODE_ARCH }}.dmg" >> "$GITHUB_OUTPUT"

      # The DMG's volume icon is set via badge_icon in dmg-settings.py; this
      # pass replaces the volume icon itself inside the DMG if the first one
      # did not take (idempotent, just overwrites the same .VolumeIcon.icns).
      - name: Patch DMG volume icon
        run: python3 build/darwin/patch-dmg.py out/${{ steps.create-dmg.outputs.dmg-name }} resources/darwin/code.icns

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParaCode-darwin-${{ env.VSCODE_ARCH }}
          path: out/${{ steps.create-dmg.outputs.dmg-name }}
          if-no-files-found: error

      # Each matrix job uploads its own arch DMG to the SAME release/tag.
      # Both jobs race on the first `gh release create`; the loser falls back
      # to `--clobber` upload, which appends the asset on top of the release
      # the winner just created.
      - name: Attach to GitHub Release
        run: |
          TAG="${{ steps.release-tag.outputs.tag }}"
          DMG="out/${{ steps.create-dmg.outputs.dmg-name }}"

          # Derive the changelog version key from the tag, e.g. release-v1.2.3 -> 1.2.3.
          VER="${TAG#release-v}"

          python3 - "$VER" <<'PYEOF_SCRIPT' > /tmp/release-notes.md
          import re, sys
          ver = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()

          # Extract the changelog section for this version (## [1.2.3] ... up to the next ##).
          m = re.search(r'^## \[' + re.escape(ver) + r'\]\s*(.*?)(?=^## |\Z)', text, re.M | re.S)
          if not m:
              sys.stderr.write(f'ERROR: CHANGELOG.md has no section for version {ver}.\n')
              sys.stderr.write('Add a "## [%s]" section to CHANGELOG.md before releasing.\n' % ver)
              sys.exit(1)
          body = m.group(1).strip()
          # Avoid a duplicated separator when the version section ends with '---'.
          body = re.sub(r'^---+\s*$', '', body, flags=re.M).strip()

          sys.stdout.write(body)
          PYEOF_SCRIPT

          gh release create "$TAG" "$DMG" \
            --title "vscode-fork $TAG" \
            --notes-file /tmp/release-notes.md \
          || gh release upload "$TAG" "$DMG" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
